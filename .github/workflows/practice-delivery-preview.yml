name: Practice delivery review preview
on:
  push:
    branches: [codex/practice-delivery-preview]
permissions:
  contents: read
concurrency:
  group: practice-delivery-review-preview
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    timeout-minutes: 20
    env:
      WEB_ORIGIN: https://practice-delivery-review.practiceengine-dev.pages.dev
      VITE_DEMO_MODE: "true"
      VITE_PM_PROGRESS_PREVIEW: "true"
      VITE_API_URL: https://practice-delivery-review.practiceengine-dev.pages.dev
      VITE_NEON_AUTH_URL: https://practice-delivery-review.practiceengine-dev.pages.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:ui-quality --workspace apps/web
      - name: Verify delivery, navigation and visual reflow
        working-directory: apps/web
        env:
          PRACTICE_REVIEW_INLINE_EVIDENCE: "true"
        run: npx playwright test e2e/practice-delivery.spec.ts e2e/direction-1-1.spec.ts e2e/application-shell.spec.ts e2e/work-quality.spec.ts --project=chromium --workers=1
      - name: Retain visual and interaction evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: practice-visual-review
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7
      - name: Build the labelled sample-data review
        run: npm run build:production --workspace apps/web
      - name: Guard the preview target
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const r = await fetch("https://api.cloudflare.com/client/v4/accounts/" + process.env.CLOUDFLARE_ACCOUNT_ID + "/pages/projects/practiceengine-dev", {headers:{Authorization:"Bearer " + process.env.CLOUDFLARE_API_TOKEN}});
          const data = await r.json();
          if (!r.ok || !data.success || data.result.name !== "practiceengine-dev" || data.result.production_branch === "practice-delivery-review") throw new Error("Preview target guard failed");
          console.log("Publishing to a separate preview branch; live project branch remains " + data.result.production_branch);
          NODE
      - name: Publish the PracticeEngine review preview
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node ../../node_modules/wrangler/bin/wrangler.js pages deploy dist \
            --project-name practiceengine-dev \
            --branch practice-delivery-review \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "Practice visual review — sample data" \
            --commit-dirty=false
