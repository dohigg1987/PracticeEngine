name: Quality and lockstep

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  non_browser:
    name: Non-browser verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:fast

  chromium_e2e:
    name: Chromium functional E2E (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:e2e --workspace apps/web -- --project=chromium-functional --shard=${{ matrix.shard }}/2 --workers=1 --fully-parallel
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 14

  chromium_a11y:
    name: Chromium accessibility audit
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:e2e --workspace apps/web -- --project=chromium-a11y --workers=1 --fully-parallel
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-a11y
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 14

  verify:
    name: verify
    if: ${{ always() }}
    needs: [non_browser, chromium_e2e, chromium_a11y]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every quality job
        env:
          NON_BROWSER_RESULT: ${{ needs.non_browser.result }}
          CHROMIUM_E2E_RESULT: ${{ needs.chromium_e2e.result }}
          CHROMIUM_A11Y_RESULT: ${{ needs.chromium_a11y.result }}
        run: |
          test "$NON_BROWSER_RESULT" = "success"
          test "$CHROMIUM_E2E_RESULT" = "success"
          test "$CHROMIUM_A11Y_RESULT" = "success"
