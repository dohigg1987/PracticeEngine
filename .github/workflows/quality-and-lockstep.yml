name: Quality and lockstep

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:lockstep
      - run: npm run test:release-guard
      - run: npm run test:core
      - run: npm test --workspace apps/api
      - run: npm run check --workspace apps/api
      - run: npm run typecheck --workspace apps/web
      - run: npm test --workspace apps/web
      - run: npm run test:ui-quality --workspace apps/web
      - run: npm run test:headers --workspace apps/web
      - run: npm run build --workspace apps/web
      - run: npm run test:e2e --workspace apps/web -- --project=chromium
