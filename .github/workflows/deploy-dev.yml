name: Deploy DEV

on:
  push:
    branches:
      - environment/dev-integrated
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy_web:
    name: Deploy web to Cloudflare Pages (DEV)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WEB_ORIGIN: https://practiceengine-dev.pages.dev
      VITE_API_URL: https://practiceengine-api-dev.dennis-ohiggins.workers.dev
      VITE_NEON_AUTH_URL: https://ep-broad-firefly-zahbgsmb.neonauth.c-2.eu-west-2.aws.neon.tech/neondb/auth
      VITE_DEMO_MODE: "false"
    steps:
      - name: Require deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing repository secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing repository secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Guarded production-shaped build
        run: npm run build:production --workspace apps/web
      - name: Resolve the Pages production branch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          response=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/practiceengine-dev")
          if [ "$(jq -r '.success' <<<"$response")" != "true" ]; then
            echo "Could not read the Pages project."
            jq -r '.errors' <<<"$response"
            exit 1
          fi
          branch=$(jq -r '.result.production_branch' <<<"$response")
          if [ -z "$branch" ] || [ "$branch" = "null" ]; then
            echo "The Pages project reports no production_branch."
            exit 1
          fi
          echo "Pages production branch is ${branch}"
          echo "PAGES_PRODUCTION_BRANCH=${branch}" >> "$GITHUB_ENV"
      - name: Publish to Cloudflare Pages
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node ../../node_modules/wrangler/bin/wrangler.js pages deploy dist \
            --project-name practiceengine-dev \
            --branch "$PAGES_PRODUCTION_BRANCH" \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "DEV deploy $GITHUB_SHA" \
            --commit-dirty=false
      - name: Deployment summary
        run: |
          echo "Deployed ${GITHUB_SHA} to https://practiceengine-dev.pages.dev" >> "$GITHUB_STEP_SUMMARY"
