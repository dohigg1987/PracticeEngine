name: Deploy DEV

on:
  push:
    branches:
      - environment/dev-integrated
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy_web:
    name: Deploy web to Cloudflare Pages (DEV)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WEB_ORIGIN: https://practiceengine-dev.pages.dev
      VITE_API_URL: https://practiceengine-api-dev.dennis-ohiggins.workers.dev
      VITE_NEON_AUTH_URL: https://ep-broad-firefly-zahbgsmb.neonauth.c-2.eu-west-2.aws.neon.tech/neondb/auth
      VITE_DEMO_MODE: "false"
    steps:
      - name: Require deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing repository secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing repository secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Guarded production-shaped build
        run: npm run build:production --workspace apps/web
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: >-
            pages deploy dist
            --project-name practiceengine-dev
            --branch environment-dev-integrated
            --commit-hash ${{ github.sha }}
            --commit-message "DEV deploy ${{ github.sha }}"
            --commit-dirty=false
      - name: Deployment summary
        run: |
          echo "Deployed ${GITHUB_SHA} to https://practiceengine-dev.pages.dev" >> "$GITHUB_STEP_SUMMARY"
