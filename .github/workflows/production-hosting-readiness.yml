name: Read production hosting readiness

on:
  pull_request:
    paths: ['.github/workflows/production-hosting-readiness.yml']
  push:
    branches: ['chore/check-production-hosting']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosting:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Inspect the existing Pages connection without changes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN?.trim();
          const account = process.env.CLOUDFLARE_ACCOUNT_ID?.trim();
          if (!token || !account) {
            console.log("HOSTING_READINESS=" + JSON.stringify({
              status: "repository_credentials_unavailable",
              apiTokenAvailable: Boolean(token),
              accountIdAvailable: Boolean(account),
              scope: "repository Actions secrets and variables"
            }));
          } else if (!/^[a-f0-9]{32}$/i.test(account)) {
            console.log('HOSTING_READINESS={"status":"invalid_account_configuration"}');
          } else {
            const response = await fetch("https://api.cloudflare.com/client/v4/accounts/" + account + "/pages/projects/ledgerly-accounts", {
              headers: { authorization: "Bearer " + token },
              redirect: "error",
              signal: AbortSignal.timeout(20000)
            });
            const data = await response.json();
            const project = data.result;
            console.log("HOSTING_READINESS=" + JSON.stringify({
              status: response.ok && data.success ? "connected" : "unavailable",
              httpStatus: response.status,
              errorCodes: data.errors?.map(error => error.code),
              projectName: project?.name,
              productionBranch: project?.production_branch,
              productionDeployment: project?.canonical_deployment ? {
                sha: project.canonical_deployment.deployment_trigger?.metadata?.commit_hash,
                branch: project.canonical_deployment.deployment_trigger?.metadata?.branch,
                url: project.canonical_deployment.url,
                status: project.canonical_deployment.latest_stage?.status
              } : null,
              source: project?.source ? {
                type: project.source.type,
                productionDeploymentsEnabled: project.source.config?.production_deployments_enabled
              } : null
            }));
          }
          NODE
