name: Practice DEV release access
on:
  push:
    branches: [codex/practice-dev-release-check]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check existing deployment identity against the verified DEV account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const expected = "8c2bbe321bd8b9ebc8a757f397fa1192";
          console.log("Configured account matches verified DEV account:", process.env.CLOUDFLARE_ACCOUNT_ID === expected);
          const paths = [
            ["/user/tokens/verify", "Token validity"],
            ["/accounts/" + expected + "/pages/projects/practiceengine-dev", "PracticeEngine Pages"],
            ["/accounts/" + expected + "/workers/scripts/practiceengine-api-dev/settings", "PracticeEngine Worker"],
          ];
          for (const [path, label] of paths) {
            const response = await fetch("https://api.cloudflare.com/client/v4" + path, {
              headers: {Authorization: "Bearer " + process.env.CLOUDFLARE_API_TOKEN},
              signal: AbortSignal.timeout(15000),
            });
            const body = await response.json();
            console.log(JSON.stringify({label, httpStatus:response.status, success:body.success, errorCodes:body.errors?.map(e=>e.code), tokenStatus:label==="Token validity"?body.result?.status:undefined}));
          }
          NODE
